<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrocinadores | AMF Melide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-fieltro:#1E4A3D;
    --verde-fieltro-dark:#123028;
    --crema:#F6F1E4;
    --blanco:#FFFBF3;
    --rojo-remate:#C1272D;
    --laton:#B8935A;
    --laton-light:#D8BE8E;
    --tinta:#1C1B19;
    --tinta-suave:#5B564D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--crema);color:var(--tinta);font-family:'Work Sans',sans-serif;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- HERO ---------- */
  .hero{
    background:radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(180deg, var(--verde-fieltro) 0%, var(--verde-fieltro-dark) 100%);
    color:var(--crema);padding:64px 24px 72px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:repeating-linear-gradient(90deg, var(--laton) 0 18px, var(--laton-light) 18px 22px);
    opacity:0.85;
  }
  .hero-inner{max-width:920px;margin:0 auto;text-align:center;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.18em;color:var(--laton-light);margin-bottom:14px;}
  .eyebrow:empty{display:none;}
  .hero h1{font-size:clamp(30px,6vw,48px);font-weight:600;line-height:1.1;}
  .hero h1 span{color:var(--laton-light);}
  .hero p{max-width:520px;margin:14px auto 0;color:rgba(246,241,228,0.82);font-size:16px;}
  .hero p:empty{display:none;}
  .hero-logo{
    max-width:260px;margin:0 auto 20px;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.35));
  }
  .hero-logo img{width:100%;height:auto;display:block;}
  .hero-logo-fallback{
    font-family:'Oswald',sans-serif;font-weight:700;color:var(--crema);font-size:34px;
    letter-spacing:0.04em;margin-bottom:20px;
  }

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    position:sticky;top:0;z-index:30;background:rgba(246,241,228,0.94);backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(28,27,25,0.1);padding:14px 24px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;
  }
  .search-input{
    font-family:'Work Sans',sans-serif;font-size:14px;padding:9px 14px;border-radius:20px;
    border:1px solid rgba(28,27,25,0.18);background:var(--blanco);min-width:220px;outline:none;
  }
  .search-input:focus{border-color:var(--verde-fieltro);}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.04em;
    padding:8px 14px;border-radius:20px;border:1px solid rgba(28,27,25,0.18);background:var(--blanco);
    color:var(--tinta-suave);transition:all .12s ease;
  }
  .chip:hover{border-color:var(--laton);}
  .chip.active{background:var(--chip-color, var(--verde-fieltro));color:#FBF7EC;border-color:var(--chip-color, var(--verde-fieltro));}

  /* ---------- ORO SHOWCASE ---------- */
  .oro-section{max-width:1080px;margin:44px auto 0;padding:0 24px;}
  .oro-header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .oro-header h2{font-size:24px;color:var(--laton);}
  .oro-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px,1fr));gap:20px;}
  .card.tier-oro{border:2px solid var(--laton);background:linear-gradient(160deg,#FFFBF3,#FAF0D9);padding:24px;}
  .card.tier-oro .logo-box{width:60px;height:60px;}
  .card.tier-oro .card-name{font-size:19px;}

  /* ---------- ROD DIVIDER ---------- */
  .rod-wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .rod{display:flex;align-items:center;gap:14px;margin:56px 0 30px;}
  .rod-handle{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #EDE0C4, var(--laton) 70%);box-shadow:0 1px 2px rgba(0,0,0,0.25);flex:none;}
  .rod-bar{flex:1;height:6px;border-radius:3px;background:linear-gradient(180deg, #E7D3AA, var(--laton) 45%, #8C6C3E);box-shadow:inset 0 1px 1px rgba(255,255,255,0.4);}
  .rod-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.14em;color:var(--tinta-suave);white-space:nowrap;}

  /* ---------- LINE SECTIONS ---------- */
  .linea{max-width:1080px;margin:0 auto;padding:0 24px 12px;}
  .linea-header{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .linea-tag{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.1em;background:var(--rojo-remate);color:#fff;padding:4px 10px;border-radius:3px;}
  .linea h2{font-size:26px;color:var(--verde-fieltro);}
  .linea-sub{font-size:14px;color:var(--tinta-suave);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px,1fr));gap:18px;margin-bottom:12px;}
  .card{background:var(--blanco);border:1px solid rgba(28,27,25,0.08);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .15s ease, box-shadow .15s ease;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,74,61,0.14);border-color:var(--laton);}
  .card-grande{padding:26px;}
  .card-grande .logo-box{width:72px;height:72px;}
  .card-grande .card-name{font-size:21px;}
  .card-grande .card-desc{font-size:14.5px;}
  .card-top{display:flex;align-items:center;gap:12px;}
  .logo-box{width:52px;height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;}
  .logo-box img{width:100%;height:100%;object-fit:contain;}
  .logo-fallback{font-family:'Oswald',sans-serif;font-weight:600;color:var(--verde-fieltro);font-size:18px;}
  .card-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--tinta);}
  .card-desc{font-size:13.5px;color:var(--tinta-suave);}
  .card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px;}
  .pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;background:var(--crema);border:1px solid rgba(28,27,25,0.1);text-decoration:none;display:inline-flex;align-items:center;gap:5px;color:var(--verde-fieltro);}
  .pill:hover{background:var(--verde-fieltro);color:var(--crema);border-color:var(--verde-fieltro);}
  .tier-badge{font-size:11px;flex:none;padding:2px 8px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-weight:600;margin-left:auto;}
  .tier-badge.oro{background:#F3E2B8;color:#7A5B1E;}
  .tier-badge.plata{background:#E4E4E4;color:#5B5B5B;}
  .tier-badge.bronce{background:#E8D6C3;color:#7A5233;}
  .card.tier-bronce{padding:14px;gap:6px;}
  .card.tier-bronce .logo-box{width:40px;height:40px;}
  .card.tier-bronce .card-name{font-size:14.5px;}
  .card.tier-bronce .card-desc{display:none;}
  .card.tier-bronce .pill{font-size:11px;padding:4px 8px;}

  .empty{font-size:13.5px;color:var(--tinta-suave);padding:18px;border:1px dashed rgba(28,27,25,0.2);border-radius:8px;grid-column:1/-1;text-align:center;}

  /* ---------- FOOTER ---------- */
  footer{background:var(--verde-fieltro-dark);color:rgba(246,241,228,0.75);text-align:center;padding:44px 24px 34px;margin-top:60px;}
  footer .amf{font-family:'Oswald',sans-serif;color:var(--crema);font-size:18px;letter-spacing:0.06em;}
  footer .links{margin-top:12px;font-size:13.5px;}
  footer .links a{margin:0 8px;text-decoration:none;color:var(--laton-light);}
  footer .links a:hover{text-decoration:underline;}
  footer .copy{margin-top:18px;font-size:11.5px;color:rgba(246,241,228,0.4);}

  /* ---------- MODO TV ---------- */
  .tv-screen{
    display:none;position:fixed;inset:0;z-index:999;
    align-items:center;justify-content:center;
    background:var(--verde-fieltro-dark);
    overflow:hidden;
  }
  body.tv-active .tv-screen{display:flex;}
  body.tv-active .hero, body.tv-active .toolbar, body.tv-active #contenido,
  body.tv-active footer, body.tv-active .fab{display:none!important;}
  #tvWatermark{position:fixed;top:34px;left:44px;width:100px;z-index:1000;opacity:0.92;}
  #tvContent{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  .tv-inner{text-align:center;color:#FBF7EC;padding:0 40px;}
  .tv-logo{max-width:58vw;max-height:42vh;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,0.4));margin-bottom:44px;}
  .tv-logo-fallback{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:min(22vw,220px);
    line-height:1;color:#FBF7EC;margin-bottom:20px;letter-spacing:0.02em;
  }
  .tv-name{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:min(6vw,58px);font-weight:600;letter-spacing:0.03em;}
  .tv-cat{font-family:'JetBrains Mono',monospace;font-size:min(2.2vw,20px);letter-spacing:0.18em;opacity:0.75;margin-top:16px;text-transform:uppercase;}
  #tvCounter{position:fixed;bottom:32px;right:44px;font-family:'JetBrains Mono',monospace;color:rgba(251,247,236,0.55);font-size:16px;z-index:1000;letter-spacing:0.06em;}

  @media(max-width:520px){
    .hero{padding:48px 18px 60px;}
    .linea{padding:0 16px 4px;}
    .grid{grid-template-columns:repeat(2, 1fr);gap:10px;}
    .card{padding:12px;gap:6px;}
    .logo-box{width:38px;height:38px;}
    .card-name{font-size:14px;}
    .card-desc{font-size:12px;}
    .pill{font-size:11px;padding:5px 8px;}
  }

  /* =====================================================
     ADMIN
  ===================================================== */
  .fab{
    display:none;
    position:fixed;bottom:22px;right:22px;z-index:100;
    width:52px;height:52px;border-radius:50%;border:none;
    background:var(--verde-fieltro);color:var(--crema);font-size:22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  body.admin-visible .fab{display:flex;align-items:center;justify-content:center;}
  .fab:hover{background:var(--verde-fieltro-dark);}

  .overlay{
    position:fixed;inset:0;background:rgba(20,20,18,0.55);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex;}
  .pin-box{background:var(--blanco);border-radius:12px;padding:28px;max-width:320px;width:100%;text-align:center;}
  .pin-box h3{color:var(--verde-fieltro);margin-bottom:14px;font-size:18px;}
  .pin-box input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(28,27,25,0.2);font-size:15px;margin-bottom:12px;}

  .admin-panel{
    position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);z-index:150;
    background:var(--crema);box-shadow:-8px 0 24px rgba(0,0,0,0.2);
    display:none;flex-direction:column;
  }
  .admin-panel.show{display:flex;}
  .admin-head{
    background:var(--verde-fieltro);color:var(--crema);padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .admin-head h2{font-size:17px;}
  .admin-close{background:none;border:none;color:var(--crema);font-size:20px;}
  .admin-tabs{display:flex;border-bottom:1px solid rgba(28,27,25,0.12);background:var(--blanco);}
  .admin-tab{
    flex:1;border:none;background:none;padding:12px 6px;font-size:12.5px;font-weight:600;
    color:var(--tinta-suave);border-bottom:2px solid transparent;
  }
  .admin-tab.active{color:var(--verde-fieltro);border-color:var(--rojo-remate);}
  .admin-body{flex:1;overflow-y:auto;padding:18px 20px 100px;}
  .admin-body h4{font-size:12px;letter-spacing:0.08em;color:var(--tinta-suave);text-transform:uppercase;margin:18px 0 8px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-suave);margin-bottom:4px;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field textarea, .field select{
    width:100%;padding:8px 10px;border-radius:7px;border:1px solid rgba(28,27,25,0.2);
    font-family:inherit;font-size:13.5px;background:var(--blanco);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .btn{border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--verde-fieltro);color:var(--crema);}
  .btn-primary:hover{background:var(--verde-fieltro-dark);}
  .btn-ghost{background:var(--blanco);border:1px solid rgba(28,27,25,0.2);color:var(--tinta);}
  .btn-danger{background:#fff;border:1px solid var(--rojo-remate);color:var(--rojo-remate);}
  .btn-danger:hover{background:var(--rojo-remate);color:#fff;}
  .btn-small{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-block{width:100%;margin-top:6px;}

  .item-card{background:var(--blanco);border:1px solid rgba(28,27,25,0.12);border-radius:8px;padding:12px;margin-bottom:10px;}
  .item-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .item-card-top strong{flex:1;font-size:13.5px;}
  .item-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .logo-preview{width:34px;height:34px;border-radius:6px;object-fit:contain;background:var(--crema);border:1px solid rgba(28,27,25,0.1);flex:none;}
  .muted{color:var(--tinta-suave);font-size:12px;}
  .divider{border:none;border-top:1px solid rgba(28,27,25,0.12);margin:18px 0;}
  .help{font-size:11.5px;color:var(--tinta-suave);margin-top:2px;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div id="heroLogo"></div>
    <div class="eyebrow" id="heroEyebrow"></div>
    <h1 id="heroTitulo"></h1>
    <p id="heroSub"></p>
  </div>
</div>

<div class="toolbar">
  <input id="buscador" class="search-input" type="text" placeholder="🔍 Buscar patrocinador...">
  <div id="chips" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
  <a href="?tv=1" target="_blank" class="chip" style="text-decoration:none;">📺 Modo TV</a>
</div>

<div id="contenido"></div>

<footer>
  <div class="amf" id="footAmf">Asociación Melide Futbolín</div>
  <div class="links" id="footLinks"></div>
  <div class="copy" id="footCopy"></div>
</footer>

<button class="fab" id="fabEdit" title="Editar página">⚙️</button>

<!-- MODO TV -->
<div class="tv-screen" id="tvScreen">
  <img id="tvWatermark" src="" alt="AMF">
  <div id="tvContent"></div>
  <div id="tvCounter"></div>
</div>

<!-- PIN -->
<div class="overlay" id="pinOverlay">
  <div class="pin-box">
    <h3>🔒 Acceso de edición</h3>
    <input type="password" id="pinInput" placeholder="PIN">
    <button class="btn btn-primary btn-block" id="pinSubmit">Entrar</button>
    <button class="btn btn-ghost btn-block" id="pinCancel" style="margin-top:8px;">Cancelar</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-head">
    <h2>✏️ Editar patrocinadores</h2>
    <button class="admin-close" id="adminClose">✕</button>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="cabecera">Cabecera</button>
    <button class="admin-tab" data-tab="categorias">Categorías</button>
    <button class="admin-tab" data-tab="patrocinadores">Patrocinadores</button>
    <button class="admin-tab" data-tab="datos">Datos</button>
  </div>
  <div class="admin-body" id="adminBody"></div>
</div>

<input type="file" id="fileHidden" accept="image/*" style="display:none;">
<input type="file" id="fileImportJson" accept="application/json" style="display:none;">

let DATA = cargarDatos();
let estado = { query:"", categoria:"todos" };

function cargarDatos(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      (parsed.patrocinadores||[]).forEach(p=>{
        if(!p.categorias){ p.categorias = p.categoria ? [p.categoria] : []; }
        delete p.categoria;
      });
      return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function guardar(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }
function slugify(str){
  return str.toString().toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || uid();
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseTitulo(t){
  return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<span>$1</span>');
}

/* ---------- PUBLIC RENDER ---------- */
function renderHeader(){
  document.getElementById("heroEyebrow").textContent = DATA.header.eyebrow || "";
  document.getElementById("heroTitulo").innerHTML = parseTitulo(DATA.header.titulo || "");
  document.getElementById("heroSub").textContent = DATA.header.subtitulo || "";
  const logoEl = document.getElementById("heroLogo");
  logoEl.innerHTML = DATA.header.logo
    ? `<div class="hero-logo"><img src="${DATA.header.logo}" alt="AMF"></div>`
    : `<div class="hero-logo-fallback">AMF</div>`;

  document.getElementById("footLinks").innerHTML = [
    DATA.footer.instagram ? `<a href="${DATA.footer.instagram}" target="_blank" rel="noopener">Instagram</a>` : "",
    DATA.footer.facebook ? `<a href="${DATA.footer.facebook}" target="_blank" rel="noopener">Facebook</a>` : "",
    DATA.footer.email ? `<a href="mailto:${DATA.footer.email}">${DATA.footer.email}</a>` : "",
    DATA.footer.extra ? `<a href="${DATA.footer.extra}" target="_blank" rel="noopener">${escapeHtml(DATA.footer.extraLabel||"Enlace")}</a>` : "",
  ].filter(Boolean).join("·");
  document.getElementById("footCopy").textContent = DATA.footer.copy || "";
}

function renderChips(){
  const cont = document.getElementById("chips");
  const cats = [...DATA.categorias].sort((a,b)=>a.orden-b.orden);
  let html = `<button class="chip ${estado.categoria==='todos'?'active':''}" data-cat="todos">Todos</button>`;
  cats.forEach(c=>{
    html += `<button class="chip ${estado.categoria===c.key?'active':''}" data-cat="${c.key}" style="--chip-color:${c.color||'#1E4A3D'}">${c.emoji||''} ${escapeHtml(c.nombre)}</button>`;
  });
  cont.innerHTML = html;
  cont.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{ estado.categoria = chip.dataset.cat; renderPublic(); });
  });
}

const NIVEL_ORDEN = { oro:0, plata:1, bronce:2 };
const NIVEL_LABEL = { oro:"🥇 Oro", plata:"🥈 Plata", bronce:"🥉 Bronce" };
function iniciales(nombre){ return (nombre||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderCard(p, color){
  color = color || '#1E4A3D';
  const grande = p.tamano === 'grande';
  const logoHtml = p.logo
    ? `<img src="${p.logo}" alt="${escapeHtml(p.nombre)}" loading="lazy">`
    : `<span class="logo-fallback" style="background:${color};color:#FBF7EC;">${iniciales(p.nombre)}</span>`;
  const pills = [];
  if(p.maps) pills.push(`<a class="pill" style="background:${hexToRgba(color,0.12)};color:${color};" href="${p.maps}" target="_blank" rel="noopener">📍 Cómo llegar</a>`);
  if(p.web) pills.push(`<a class="pill" style="background:${hexToRgba(color,0.12)};color:${color};" href="${p.web}" target="_blank" rel="noopener">🌐 Web</a>`);
  if(p.instagram) pills.push(`<a class="pill" style="background:#FBEAF0;color:#993556;" href="${p.instagram}" target="_blank" rel="noopener">📷 Instagram</a>`);
  const cardStyle = `border-top:4px solid ${color};${grande ? ' grid-column: span 2;' : ''}`;
  return `
    <div class="card${grande ? ' card-grande' : ''}" style="${cardStyle}">
      <div class="card-top">
        <div class="logo-box">${logoHtml}</div>
        <div class="card-name">${escapeHtml(p.nombre)}</div>
      </div>
      <div class="card-desc">${escapeHtml(p.descripcion||"")}</div>
      <div class="card-actions">${pills.join("")}</div>
    </div>`;
}

function filtrar(lista){
  const q = estado.query.trim().toLowerCase();
  return lista.filter(p=>{
    const okCat = estado.categoria === "todos" || (p.categorias||[]).includes(estado.categoria);
    const okQuery = !q || p.nombre.toLowerCase().includes(q);
    return okCat && okQuery;
  });
}

function renderPublic(){
  renderHeader();
  renderChips();
  const cont = document.getElementById("contenido");
  const filtrados = filtrar(DATA.patrocinadores);

  if(filtrados.length === 0){
    cont.innerHTML = `<div class="linea"><div class="empty">Non se atoparon patrocinadores.</div></div>`;
    return;
  }
  let html = "";
  const cats = [...DATA.categorias].sort((a,b)=>a.orden-b.orden);
  cats.forEach(cat=>{
    if(estado.categoria !== "todos" && estado.categoria !== cat.key) return;
    const items = filtrados.filter(p=>(p.categorias||[]).includes(cat.key))
      .sort((a,b)=> (a.orden||0)-(b.orden||0));
    if(!items.length) return;
    html += `
    <div class="rod-wrap"><div class="rod"><div class="rod-handle"></div><div class="rod-bar"></div>
      <div class="rod-label mono">${items.length} PATROCINADOR${items.length!==1?'ES':''}</div>
      <div class="rod-bar"></div><div class="rod-handle"></div></div></div>
    <div class="linea">
      <div class="linea-header">
        <h2 style="color:${cat.color||'#1E4A3D'};">${cat.emoji||''} ${escapeHtml(cat.nombre)}</h2>
        ${cat.descripcion ? `<span class="linea-sub">${escapeHtml(cat.descripcion)}</span>` : ''}
      </div>
      <div class="grid">${items.map(p=>renderCard(p, cat.color)).join("")}</div>
    </div>`;
  });
  cont.innerHTML = html || `<div class="linea"><div class="empty">Non se atoparon patrocinadores.</div></div>`;
}

document.getElementById("buscador").addEventListener("input", e=>{ estado.query = e.target.value; renderPublic(); });

const fab = document.getElementById("fabEdit");
const pinOverlay = document.getElementById("pinOverlay");
const adminPanel = document.getElementById("adminPanel");
let adminTab = "cabecera";

fab.addEventListener("click", ()=>{
  if(sessionStorage.getItem("amfAdminOk")==="1"){ abrirAdmin(); }
  else{ pinOverlay.classList.add("show"); document.getElementById("pinInput").focus(); }
});
document.getElementById("pinCancel").addEventListener("click", ()=>pinOverlay.classList.remove("show"));
document.getElementById("pinSubmit").addEventListener("click", intentarPin);
document.getElementById("pinInput").addEventListener("keydown", e=>{ if(e.key==="Enter") intentarPin(); });
function intentarPin(){
  const val = document.getElementById("pinInput").value;
  if(val === ADMIN_PIN){
    sessionStorage.setItem("amfAdminOk","1");
    pinOverlay.classList.remove("show");
    document.getElementById("pinInput").value = "";
    abrirAdmin();
  } else {
    alert("PIN incorrecto");
  }
}
function abrirAdmin(){ adminPanel.classList.add("show"); renderAdmin(); }
document.getElementById("adminClose").addEventListener("click", ()=>adminPanel.classList.remove("show"));
document.querySelectorAll(".admin-tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".admin-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); adminTab = t.dataset.tab; renderAdmin();
  });
});

function renderAdmin(){
  const body = document.getElementById("adminBody");
  if(adminTab==="cabecera") body.innerHTML = tplCabecera();
  if(adminTab==="categorias") body.innerHTML = tplCategorias();
  if(adminTab==="patrocinadores") body.innerHTML = tplPatrocinadores();
  if(adminTab==="datos") body.innerHTML = tplDatos();
  bindAdminEvents();
}

/* ---- CATEGORÍAS ---- */
function tplCategorias(){
  const cats = [...DATA.categorias].sort((a,b)=>a.orden-b.orden);
  let html = `<p class="help">La posición determina el orden en que aparecen las secciones en la página. Sube o baja cada una con las flechas. El color se usa en la franja de las tarjetas, el título y el filtro.</p>`;
  cats.forEach((c,i)=>{
    const n = DATA.patrocinadores.filter(p=>(p.categorias||[]).includes(c.key)).length;
    html += `
    <div class="item-card" data-cat="${c.key}">
      <div class="item-card-top">
        <input type="color" value="${c.color||'#1E4A3D'}" data-field="color" data-cat="${c.key}" style="width:32px;height:32px;padding:0;border:none;border-radius:6px;flex:none;">
        <input type="text" style="width:44px;text-align:center;" value="${escapeHtml(c.emoji||'')}" data-field="emoji" data-cat="${c.key}">
        <input type="text" style="flex:1;" value="${escapeHtml(c.nombre)}" data-field="nombre" data-cat="${c.key}">
      </div>
      <input type="text" placeholder="Descripción breve (opcional)" value="${escapeHtml(c.descripcion||'')}" data-field="descripcion" data-cat="${c.key}" style="width:100%;padding:6px 8px;font-size:12.5px;border-radius:6px;border:1px solid rgba(28,27,25,0.15);">
      <div class="item-card-actions">
        <button class="btn btn-ghost btn-small" data-action="mover-cat" data-dir="-1" data-cat="${c.key}" ${i===0?'disabled':''}>↑</button>
        <button class="btn btn-ghost btn-small" data-action="mover-cat" data-dir="1" data-cat="${c.key}" ${i===cats.length-1?'disabled':''}>↓</button>
        <span class="muted" style="margin-left:auto;align-self:center;">${n} patrocinador(es)</span>
        <button class="btn btn-danger btn-small" data-action="borrar-cat" data-cat="${c.key}">Eliminar</button>
      </div>
    </div>`;
  });
  html += `
    <hr class="divider">
    <h4>Nueva categoría</h4>
    <div class="field-row">
      <div class="field" style="max-width:50px;"><label>Color</label><input type="color" id="nc_color" value="#1E4A3D" style="width:36px;height:36px;padding:0;border:none;"></div>
      <div class="field" style="max-width:70px;"><label>Icono</label><input type="text" id="nc_emoji" placeholder="🎯"></div>
      <div class="field"><label>Nombre</label><input type="text" id="nc_nombre" placeholder="Ej: Deportes"></div>
    </div>
    <button class="btn btn-primary btn-block" data-action="add-cat">+ Añadir categoría</button>
  `;
  return html;
}

/* ---- PATROCINADORES ---- */
function tplPatrocinadores(){
  let html = `<div class="field"><input type="text" id="admBuscar" placeholder="🔍 Filtrar por nombre..."></div>`;
  const q = (document.getElementById("admBuscar")?.value || "").toLowerCase();
  const lista = [...DATA.patrocinadores].filter(p=>!q || p.nombre.toLowerCase().includes(q))
    .sort((a,b)=> a.nombre.localeCompare(b.nombre));

  lista.forEach(p=>{
    const cats = (p.categorias||[]);
    const emojis = cats.map(k=>{const c=DATA.categorias.find(x=>x.key===k); return c?c.emoji:'';}).join(' ');
    html += `
    <div class="item-card" data-id="${p.id}">
      <div class="item-card-top">
        ${p.logo?`<img class="logo-preview" src="${p.logo}">`:`<span class="muted">🏷️</span>`}
        <strong>${escapeHtml(p.nombre)}</strong>
        <span class="muted">${emojis}</span>
      </div>
      <div class="field-row">
        <div class="field"><label>Nombre</label><input type="text" data-field="nombre" data-id="${p.id}" value="${escapeHtml(p.nombre)}"></div>
      </div>
      <div class="field">
        <label>Categorías (puedes marcar varias)</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${DATA.categorias.map(c=>`
            <label style="display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;background:var(--crema);padding:5px 9px;border-radius:14px;border:1px solid rgba(28,27,25,0.15);">
              <input type="checkbox" data-cat-toggle="1" data-id="${p.id}" data-catkey="${c.key}" ${cats.includes(c.key)?'checked':''} style="width:auto;">
              ${c.emoji||''} ${escapeHtml(c.nombre)}
            </label>`).join("")}
        </div>
      </div>
      <div class="field"><label>Descripción</label><textarea data-field="descripcion" data-id="${p.id}">${escapeHtml(p.descripcion||'')}</textarea></div>
      <div class="field">
        <label>Logo</label>
        <div class="field-row" style="align-items:center;">
          <input type="text" style="flex:1;" placeholder="URL de imagen" data-field="logo" data-id="${p.id}" value="${escapeHtml(p.logo||'')}">
          <button class="btn btn-ghost btn-small" data-action="subir-logo-sponsor" data-id="${p.id}">📁</button>
        </div>
      </div>
      <div class="field"><label>Enlace Google Maps</label><input type="text" data-field="maps" data-id="${p.id}" value="${escapeHtml(p.maps||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Web</label><input type="text" data-field="web" data-id="${p.id}" value="${escapeHtml(p.web||'')}"></div>
        <div class="field"><label>Instagram</label><input type="text" data-field="instagram" data-id="${p.id}" value="${escapeHtml(p.instagram||'')}"></div>
      </div>
      <div class="field-row">
        <div class="field" style="max-width:120px;"><label>Orden</label><input type="number" data-field="orden" data-id="${p.id}" value="${p.orden||0}"></div>
        <div class="field" style="display:flex;align-items:flex-end;gap:6px;padding-bottom:8px;">
          <input type="checkbox" id="gr_${p.id}" data-field="tamano" data-id="${p.id}" data-checkbox="1" data-checkval="grande" ${p.tamano==='grande'?'checked':''} style="width:auto;">
          <label for="gr_${p.id}" style="margin:0;">Ocupar doble espacio (más grande)</label>
        </div>
      </div>
      <div class="item-card-actions">
        <button class="btn btn-danger btn-small" data-action="borrar-sponsor" data-id="${p.id}">Eliminar patrocinador</button>
      </div>
    </div>`;
  });

  html += `
    <hr class="divider">
    <h4>Nuevo patrocinador</h4>
    <div class="field"><label>Nombre</label><input type="text" id="np_nombre" placeholder="Nombre del negocio"></div>
    <div class="field">
      <label>Categorías (puedes marcar varias)</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${DATA.categorias.map(c=>`
          <label style="display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;background:var(--crema);padding:5px 9px;border-radius:14px;border:1px solid rgba(28,27,25,0.15);">
            <input type="checkbox" class="np-cat" value="${c.key}" style="width:auto;">
            ${c.emoji||''} ${escapeHtml(c.nombre)}
          </label>`).join("")}

    </div>

/* ---- BIND EVENTS ---- */
function bindAdminEvents(){
  const body = document.getElementById("adminBody");

  // text/select/number/textarea inputs -> update DATA live
  body.querySelectorAll("[data-field]").forEach(el=>{
    const ev = (el.tagName==="SELECT" || el.dataset.checkbox) ? "change" : "input";
    el.addEventListener(ev, ()=>{
      const field = el.dataset.field;
      if(el.dataset.cat !== undefined){
        const cat = DATA.categorias.find(c=>c.key===el.dataset.cat);
        if(cat) cat[field] = el.value;
      } else if(el.dataset.id !== undefined){
        const p = DATA.patrocinadores.find(x=>x.id===el.dataset.id);
        if(p){
          if(el.dataset.checkbox) p[field] = el.dataset.checkval ? (el.checked ? el.dataset.checkval : '') : el.checked;
          else p[field] = (field==="orden") ? Number(el.value)||0 : el.value;
        }
      } else {
        // header/footer fields
        const map = {
          f_eyebrow:["header","eyebrow"], f_titulo:["header","titulo"], f_subtitulo:["header","subtitulo"],
          f_email:["footer","email"], f_instagram:["footer","instagram"], f_facebook:["footer","facebook"],
          f_extraLabel:["footer","extraLabel"], f_extra:["footer","extra"], f_copy:["footer","copy"]
        };
        const m = map[el.id];
        if(m) DATA[m[0]][m[1]] = el.value;
      }
      guardar(); renderPublic();
      if(field==="categoria" || field==="nivel") renderAdmin(); // needs re-sort/grouping
    });
  });

  if(body.querySelector("#admBuscar")) body.querySelector("#admBuscar").addEventListener("input", renderAdmin);

  // category checkboxes (multi) for existing sponsors
  body.querySelectorAll("[data-cat-toggle]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const p = DATA.patrocinadores.find(x=>x.id===el.dataset.id);
      if(!p) return;
      if(!p.categorias) p.categorias = [];
      const key = el.dataset.catkey;
      if(el.checked){ if(!p.categorias.includes(key)) p.categorias.push(key); }
      else { p.categorias = p.categorias.filter(k=>k!==key); }
      guardar(); renderPublic();
    });
  });

  body.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>onAdminAction(el));
  });
}

function onAdminAction(el){
  const action = el.dataset.action;

  if(action==="subir-logo-header"){
    pedirImagen(dataUrl=>{ DATA.header.logo = dataUrl; guardar(); renderPublic(); renderAdmin(); });
  }
  if(action==="quitar-logo-header"){
    DATA.header.logo = ""; guardar(); renderPublic(); renderAdmin();
  }
  if(action==="subir-logo-sponsor"){
    const id = el.dataset.id;
    pedirImagen(dataUrl=>{
      const p = DATA.patrocinadores.find(x=>x.id===id);
      if(p){ p.logo = dataUrl; guardar(); renderPublic(); renderAdmin(); }
    });
  }
  if(action==="add-cat"){
    const nombre = document.getElementById("nc_nombre").value.trim();
    const emoji = document.getElementById("nc_emoji").value.trim();
    const color = document.getElementById("nc_color").value;
    if(!nombre){ alert("Ponle un nombre a la categoría"); return; }
    DATA.categorias.push({ key:slugify(nombre)+"_"+Date.now().toString(36).slice(-4), nombre, emoji, color, descripcion:"", orden:DATA.categorias.length });
    guardar(); renderPublic(); renderAdmin();
  }
  if(action==="borrar-cat"){
    const key = el.dataset.cat;
    const n = DATA.patrocinadores.filter(p=>(p.categorias||[]).includes(key)).length;
    if(n>0 && !confirm(`Esta categoría tiene ${n} patrocinador(es). ¿Eliminarla igualmente? (los patrocinadores no se borrarán, solo dejarán de estar en esta categoría)`)) return;
    DATA.categorias = DATA.categorias.filter(c=>c.key!==key);
    DATA.patrocinadores.forEach(p=>{ p.categorias = (p.categorias||[]).filter(k=>k!==key); });
    guardar(); renderPublic(); renderAdmin();
  }
  if(action==="mover-cat"){
    const key = el.dataset.cat, dir = Number(el.dataset.dir);
    const cats = [...DATA.categorias].sort((a,b)=>a.orden-b.orden);
    const idx = cats.findIndex(c=>c.key===key);
    const swapIdx = idx+dir;
    if(swapIdx<0 || swapIdx>=cats.length) return;
    [cats[idx].orden, cats[swapIdx].orden] = [cats[swapIdx].orden, cats[idx].orden];
    guardar(); renderPublic(); renderAdmin();
  }
  if(action==="add-sponsor"){
    const nombre = document.getElementById("np_nombre").value.trim();
    if(!nombre){ alert("Ponle un nombre al patrocinador"); return; }
    const categorias = [...document.querySelectorAll(".np-cat:checked")].map(el=>el.value);
    DATA.patrocinadores.push({
      id:uid(), nombre, categorias,
      descripcion:"", logo:"", maps:"", web:"", instagram:"", orden:0, destacado:false, tamano:""
    });
    guardar(); renderPublic(); renderAdmin();
  }
  if(action==="borrar-sponsor"){
    if(!confirm("¿Eliminar este patrocinador?")) return;
    DATA.patrocinadores = DATA.patrocinadores.filter(p=>p.id!==el.dataset.id);
    guardar(); renderPublic(); renderAdmin();
  }
  if(action==="exportar-html") exportarHTML();
  if(action==="exportar-json") exportarJSON();
  if(action==="importar-json") document.getElementById("fileImportJson").click();
  if(action==="reset-datos"){
    if(!confirm("Esto borra todos los cambios guardados en este navegador. ¿Seguro?")) return;
    localStorage.removeItem(STORAGE_KEY);
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    renderPublic(); renderAdmin();
  }
}

function pedirImagen(callback){
  const input = document.getElementById("fileHidden");
  input.value = "";
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 1.5*1024*1024){ alert("La imagen pesa mucho (máx. recomendado ~1.5MB). Prueba con otra más ligera."); return; }
    const reader = new FileReader();
    reader.onload = ()=>callback(reader.result);
    reader.readAsDataURL(file);
  };
  input.click();
}

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportarJSON(){
  downloadBlob(JSON.stringify(DATA, null, 2), "patrocinadores-datos.json", "application/json");
}

document.getElementById("fileImportJson").addEventListener("change", ()=>{
  const file = document.getElementById("fileImportJson").files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.categorias || !parsed.patrocinadores) throw new Error("formato");
      DATA = parsed; guardar(); renderPublic(); renderAdmin();
      alert("Datos importados correctamente.");
    }catch(e){ alert("El archivo no tiene el formato esperado."); }
  };
  reader.readAsText(file);
});

function exportarHTML(){
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const marcador = /const DEFAULT_DATA = [\s\S]*?;\n/;
  const nuevoBloque = `const DEFAULT_DATA = ${JSON.stringify(DATA)};\n`;
  if(marcador.test(html)){
    html = html.replace(marcador, nuevoBloque);
  }
  downloadBlob(html, "patrocinadores.html", "text/html");
}

/* ---------- MODO TV ---------- */
let tvList = [];
let tvIndex = 0;
let tvTimer = null;

function buildTVPlaylist(){
  const cats = [...DATA.categorias].sort((a,b)=>a.orden-b.orden);
  const seen = new Set();
  const list = [];
  cats.forEach(cat=>{
    const items = DATA.patrocinadores
      .filter(p=>(p.categorias||[]).includes(cat.key) && !seen.has(p.id))
      .sort((a,b)=>a.nombre.localeCompare(b.nombre));
    items.forEach(p=>{
      seen.add(p.id);
      list.push(Object.assign({}, p, { _color: cat.color || '#1E4A3D', _catNombre: cat.nombre }));
    });
  });
  return list;
}

function showTVSlide(){
  if(!tvList.length) return;
  const p = tvList[tvIndex];
  const dur = p.tamano === 'grande' ? 9000 : 4500;
  const el = document.getElementById('tvContent');
  el.style.opacity = 0;
  setTimeout(()=>{
    document.getElementById('tvScreen').style.background = p._color;
    const logoHtml = p.logo
      ? `<img class="tv-logo" src="${p.logo}" alt="${escapeHtml(p.nombre)}">`
      : `<div class="tv-logo-fallback">${iniciales(p.nombre)}</div>`;
    el.innerHTML = `
      <div class="tv-inner">
        ${logoHtml}
        <div class="tv-name">${escapeHtml(p.nombre)}</div>
        <div class="tv-cat">${escapeHtml(p._catNombre)}</div>
      </div>`;
    el.style.opacity = 1;
  }, 350);
  document.getElementById('tvCounter').textContent = `${tvIndex+1} / ${tvList.length}`;
  clearTimeout(tvTimer);
  tvTimer = setTimeout(()=>{
    tvIndex = (tvIndex+1) % tvList.length;
    showTVSlide();
  }, dur);
}

function startTVMode(){
  tvList = buildTVPlaylist();
  tvIndex = 0;
  document.getElementById('tvWatermark').src = DATA.header.logo || '';
  showTVSlide();
}

function checkTVMode(){
  const params = new URLSearchParams(location.search);
  if(params.get('tv') === '1'){
    document.body.classList.add('tv-active');
    startTVMode();
  }
}

function checkAdminVisibility(){
  const params = new URLSearchParams(location.search);
  if(params.get('admin') === '1' || sessionStorage.getItem('amfAdminOk') === '1'){
    document.body.classList.add('admin-visible');
  }
}

/* ---------- INIT ---------- */
renderPublic();
checkTVMode();
checkAdminVisibility();
</script>
